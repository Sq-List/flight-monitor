name: Collect Ctrip fares

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ctrip-fare-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm test

      - name: Collect fares
        id: collect
        continue-on-error: true
        run: npm run collect

      - name: Commit run data
        if: always() && steps.collect.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: record ctrip collection"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload failure diagnostics
        if: steps.collect.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ctrip-failure
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Mark failed collection
        if: steps.collect.outcome == 'failure'
        run: exit 1
